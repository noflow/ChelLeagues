<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>CVHL Test Draft Board</title><link rel="stylesheet" href="draft-board.css?v=1"></head>
<body><header><a href="./">CVHL <span>DATABASE TEST</span></a><nav><a href="./#profile">My Profile</a><a href="draft.html">Team Board</a><a href="draft.html?view=public">Draft Viewer</a></nav></header>
<main><p class="eyebrow">CVHL database test</p><h1 id="board-title">Online Draft Board</h1><p id="board-mode" class="muted">Loading draft…</p><div id="board-message" role="status"></div>
<div class="toolbar"><label id="team-picker" hidden>Team board<select id="board-team"></select></label><label>Search players<input id="board-search" type="search" placeholder="Player or position"></label><label id="shortlist-filter" class="check" hidden><input id="highlight-only" type="checkbox"> My team’s highlights only</label><button id="board-refresh" type="button">Refresh</button></div>
<section id="board-summary" aria-label="Draft status"></section><div class="board-layout"><section><h2>Eligible players</h2><p id="player-count" class="muted"></p><div id="board-players" class="player-list"></div></section><aside><section class="panel"><h2>Draft order</h2><ol id="board-order"></ol></section><section class="panel"><h2>Draft results</h2><div id="board-awards"></div></section></aside></div></main>
<footer>Database test only · Team scouting is excluded from the draft viewer.</footer><script src="draft-board.js?v=1" defer></script></body></html>
